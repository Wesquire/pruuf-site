<title>Pruuf for Care — agency portal</title>
<style>
/* ─────────────────────────────────────────────────────────────
   Tokens. Lifted from the iOS app's Theme.swift so the portal is
   recognisably the same product, not a lookalike.
   ───────────────────────────────────────────────────────────── */
:root{
  --canvas:#FBFAF7; --surface:#FFFFFF; --raised:#FFFFFF;
  --ink:#16150F; --ink-soft:#3A3833; --muted:#6E6A62; --faint:#8B8780;
  --hairline:#E7E4DC; --hairline-strong:#D8D4C9;
  --ok:#0E8A4F; --ok-soft:#E4F4EA;
  --warn:#B45309; --warn-soft:#FBF0E2;
  --alarm:#C1121F; --alarm-soft:#FBE9EA;
  --accent:#1D4ED8; --accent-soft:#E8EDFB; --accent-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(22,21,15,.05), 0 8px 24px -12px rgba(22,21,15,.18);
  --shadow-lift:0 2px 4px rgba(22,21,15,.06), 0 18px 40px -18px rgba(22,21,15,.28);
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --rail:250px; --topbar:60px;
  --ui:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --canvas:#131311; --surface:#1C1B18; --raised:#232220;
    --ink:#F5F2EA; --ink-soft:#DAD6CC; --muted:#9A958B; --faint:#7C776E;
    --hairline:#2E2C28; --hairline-strong:#3C3934;
    --ok:#3DBE7C; --ok-soft:#12291D;
    --warn:#E0973F; --warn-soft:#2C2013;
    --alarm:#F0555F; --alarm-soft:#2E1416;
    --accent:#7C9BFF; --accent-soft:#1A2138; --accent-ink:#0F1220;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 18px 40px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --canvas:#131311; --surface:#1C1B18; --raised:#232220;
  --ink:#F5F2EA; --ink-soft:#DAD6CC; --muted:#9A958B; --faint:#7C776E;
  --hairline:#2E2C28; --hairline-strong:#3C3934;
  --ok:#3DBE7C; --ok-soft:#12291D;
  --warn:#E0973F; --warn-soft:#2C2013;
  --alarm:#F0555F; --alarm-soft:#2E1416;
  --accent:#7C9BFF; --accent-soft:#1A2138; --accent-ink:#0F1220;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 18px 40px -18px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --canvas:#FBFAF7; --surface:#FFFFFF; --raised:#FFFFFF;
  --ink:#16150F; --ink-soft:#3A3833; --muted:#6E6A62; --faint:#8B8780;
  --hairline:#E7E4DC; --hairline-strong:#D8D4C9;
  --ok:#0E8A4F; --ok-soft:#E4F4EA;
  --warn:#B45309; --warn-soft:#FBF0E2;
  --alarm:#C1121F; --alarm-soft:#FBE9EA;
  --accent:#1D4ED8; --accent-soft:#E8EDFB; --accent-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(22,21,15,.05), 0 8px 24px -12px rgba(22,21,15,.18);
  --shadow-lift:0 2px 4px rgba(22,21,15,.06), 0 18px 40px -18px rgba(22,21,15,.28);
}

*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--ui);
     font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.021em;font-weight:800}
h1{font-size:26px} h2{font-size:19px} h3{font-size:15px} h4{font-size:13px}
p{margin:0}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}

/* ── shell ─────────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--hairline);
      display:flex;flex-direction:column;position:sticky;top:0;height:var(--stage-h,100vh)}
.brand{display:flex;align-items:center;gap:9px;padding:16px 16px 12px;border-bottom:1px solid var(--hairline)}
.mark{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--canvas);
      display:grid;place-items:center;font-weight:900;font-size:13px;flex:none}
.brand-name{font-weight:900;letter-spacing:-.02em;font-size:14px;line-height:1.1}
.brand-sub{font-size:10.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;font-weight:700}

.org{margin:10px;padding:9px 10px;border:1px solid var(--hairline);border-radius:var(--r-md);
     background:var(--canvas);cursor:pointer;display:flex;align-items:center;gap:9px;width:calc(100% - 20px)}
.org:hover{border-color:var(--hairline-strong)}
.org-badge{width:24px;height:24px;border-radius:6px;background:var(--accent-soft);color:var(--accent);
           display:grid;place-items:center;font-weight:900;font-size:11px;flex:none}
.org-name{font-weight:700;font-size:12.5px;text-align:left;line-height:1.2;flex:1;min-width:0;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

nav{padding:6px 8px;overflow-y:auto;flex:1}
.nav-group{margin-top:12px}
.nav-group>.eyebrow{padding:0 8px 5px}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:0;background:none;
          border-radius:var(--r-sm);cursor:pointer;color:var(--ink-soft);font-weight:600;font-size:13px;text-align:left}
.nav-item:hover{background:var(--canvas);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:800}
.nav-item .ic{width:16px;text-align:center;flex:none;opacity:.85}
.nav-badge{margin-left:auto;background:var(--alarm);color:#fff;border-radius:99px;padding:1px 6px;
           font-size:10.5px;font-weight:800;font-family:var(--mono)}
.rail-foot{border-top:1px solid var(--hairline);padding:9px}

/* ── topbar ────────────────────────────────────────────────── */
main{min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--topbar);border-bottom:1px solid var(--hairline);background:var(--surface);
        display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:20}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);min-width:0}
.crumbs button{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 0;font-weight:600}
.crumbs button:hover{color:var(--ink);text-decoration:underline}
.crumbs .sep{color:var(--hairline-strong)}
.crumbs .now{color:var(--ink);font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{margin-left:auto;position:relative;display:flex;align-items:center}
.search input{width:230px;padding:7px 10px 7px 28px;border:1px solid var(--hairline);border-radius:var(--r-sm);
              background:var(--canvas)}
.search input:focus{border-color:var(--accent);outline:none;width:290px}
.search .ic{position:absolute;left:9px;color:var(--faint);font-size:12px;pointer-events:none}
.icon-btn{width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--hairline);background:var(--surface);
          cursor:pointer;display:grid;place-items:center;position:relative;flex:none}
.icon-btn:hover{background:var(--canvas)}
.dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:99px;background:var(--alarm);
     border:1.5px solid var(--surface)}
.avatar{width:30px;height:30px;border-radius:99px;background:var(--ink);color:var(--canvas);
        display:grid;place-items:center;font-weight:800;font-size:11.5px;flex:none;cursor:pointer;border:0}

.view{padding:20px 22px 60px;max-width:1320px;width:100%}
.page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.page-head .grow{flex:1;min-width:240px}
.page-head p{color:var(--muted);margin-top:3px;max-width:64ch;font-size:13px}

/* ── controls ──────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:var(--r-sm);
     border:1px solid var(--hairline-strong);background:var(--surface);font-weight:700;font-size:13px;
     cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--canvas)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--alarm);border-color:var(--alarm);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--canvas)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;font-size:11.5px;
      font-weight:800;border:1px solid transparent;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.alarm{background:var(--alarm-soft);color:var(--alarm)}
.chip.neutral{background:var(--canvas);color:var(--muted);border-color:var(--hairline)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--hairline);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;font-weight:700;font-size:12.5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--hairline)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--canvas)}
select.f,input.f{padding:6px 9px;border:1px solid var(--hairline);border-radius:var(--r-sm);background:var(--surface)}

/* ── surfaces ──────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-pad{padding:16px}
.grid{display:grid;gap:12px}
.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{padding:14px 15px;position:relative;overflow:hidden;cursor:pointer;text-align:left;
      background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.stat:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.stat .v{font-size:30px;font-weight:900;letter-spacing:-.03em;font-family:var(--mono);
         font-variant-numeric:tabular-nums;line-height:1.05;margin:6px 0 2px}
.stat .d{font-size:11.5px;color:var(--muted)}
.stat .stripe{position:absolute;left:0;top:0;bottom:0;width:3px}

/* ── the wall ──────────────────────────────────────────────── */
.wall{grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.person{position:relative;text-align:left;padding:13px 14px 12px 17px;cursor:pointer;
        background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);box-shadow:var(--shadow)}
.person:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.person .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:var(--r-md) 0 0 var(--r-md)}
.person .row1{display:flex;align-items:baseline;gap:7px}
.person .nm{font-weight:800;font-size:15px;letter-spacing:-.015em}
.person .rm{font-family:var(--mono);font-size:11px;color:var(--faint)}
.person .st{font-weight:800;font-size:13px;margin-top:5px}
.person .mt{font-size:11.5px;color:var(--muted);margin-top:1px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.person .foot{display:flex;align-items:center;gap:6px;margin-top:9px}

/* ── tables ────────────────────────────────────────────────── */
.tablewrap{overflow-x:auto;border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
   font-weight:800;padding:10px 12px;border-bottom:1px solid var(--hairline);white-space:nowrap;
   background:var(--surface);position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
td{padding:10px 12px;border-bottom:1px solid var(--hairline);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--canvas)}
tbody tr:last-child td{border-bottom:0}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── detail ────────────────────────────────────────────────── */
.split{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:14px;align-items:start}
@media(max-width:1080px){.split{grid-template-columns:1fr}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--hairline);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;font-weight:700;font-size:13px;
             color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:7px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}

.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:1.5px;background:var(--hairline)}
.tl{position:relative;padding:0 0 15px}
.tl::before{content:"";position:absolute;left:-18px;top:4px;width:9px;height:9px;border-radius:99px;
            background:var(--surface);border:2px solid var(--hairline-strong)}
.tl.ok::before{border-color:var(--ok)} .tl.alarm::before{border-color:var(--alarm)}
.tl.warn::before{border-color:var(--warn)} .tl.accent::before{border-color:var(--accent)}
.tl .t{font-size:11px;color:var(--faint);font-family:var(--mono)}
.tl .h{font-weight:700;font-size:13px;margin-top:1px}
.tl .b{font-size:12.5px;color:var(--muted)}

/* ── modal / toast / menu ──────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(22,21,15,.42);backdrop-filter:blur(2px);z-index:60;
       display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lift);width:min(560px,100%);
       max-height:86vh;overflow:auto;border:1px solid var(--hairline)}
.modal-head{padding:16px 18px 0;display:flex;align-items:flex-start;gap:12px}
.modal-body{padding:12px 18px}
.modal-foot{padding:14px 18px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:var(--ink-soft)}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--hairline);
       border-radius:var(--r-sm);background:var(--canvas)}
.field .hint{font-size:11.5px;color:var(--faint);margin-top:4px}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:var(--ink);color:var(--canvas);padding:10px 14px;border-radius:var(--r-md);
       box-shadow:var(--shadow-lift);font-weight:700;font-size:13px;max-width:340px;
       animation:rise .18s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--hairline);
      border-radius:var(--r-md);box-shadow:var(--shadow-lift);min-width:210px;padding:5px;z-index:50}
.menu button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;
             border-radius:var(--r-sm);cursor:pointer;font-weight:600;font-size:13px;text-align:left}
.menu button:hover{background:var(--canvas)}
.menu .divide{height:1px;background:var(--hairline);margin:4px 0}
.rel{position:relative}

.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .big{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:4px}

/* ── setup wizard ──────────────────────────────────────────── */
.wiz{max-width:660px;margin:0 auto}
.steps{display:flex;gap:0;margin-bottom:22px;border:1px solid var(--hairline);border-radius:var(--r-md);
       overflow:hidden;background:var(--surface)}
.steps div{flex:1;padding:9px 8px;font-size:11.5px;font-weight:800;text-align:center;color:var(--faint);
           border-right:1px solid var(--hairline)}
.steps div:last-child{border-right:0}
.steps div.on{background:var(--ink);color:var(--canvas)}
.steps div.done{color:var(--ok)}
.signin{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--canvas)}
.signin .card{width:min(400px,100%);padding:26px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bar{height:6px;border-radius:99px;background:var(--hairline);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
/* ── device stage ───────────────────────────────────────────
   `#stage` is the container every layout rule below responds to,
   so the SAME rules drive a real iPad and the framed preview. No
   duplicated breakpoints, and nothing that only works in a demo. */
#stage{container-type:inline-size;width:100%}
#stage[data-device^="ipad"]{
  margin:26px auto;border-radius:20px;overflow:auto;background:var(--canvas);
  box-shadow:0 0 0 11px #1d1d1f, 0 0 0 12px #48484a, 0 26px 70px -24px rgba(0,0,0,.55);
}
#stage[data-device="ipad-l"]{width:1024px;height:768px;--stage-h:768px}
#stage[data-device="ipad-p"]{width:768px;height:1024px;--stage-h:1024px}
#stage[data-device^="ipad"] .app{min-height:100%}
.stagebar{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 0 0}
.stagebar .seg button{padding:7px 13px}
body:has(#stage[data-device^="ipad"]){background:#0e0e10}
body:has(#stage[data-device^="ipad"]) .stagebar{color:#f5f2ea}

/* ── tablet: the rail collapses to icons, reading columns stack ── */
@container (max-width:1080px){
  /* Set on `.app`, not `:root`. A container query only styles DESCENDANTS of
     its container, and `:root` is an ancestor — so redefining --rail there
     silently did nothing and the rail stayed 250px wide on both orientations. */
  .app{grid-template-columns:74px minmax(0,1fr)}
  .brand{justify-content:center;padding:14px 8px 12px}
  .brand div:not(.mark){display:none}
  .org{padding:8px;justify-content:center}
  .org-name,.org+.menu,.org span:last-child{display:none}
  /* Group labels do not fit a 74px rail — they clipped to "MONITORIN" and
     "ORGANISAT". The icons and their own labels already carry the grouping,
     so the eyebrow is spent space. A hairline keeps the rhythm. */
  .nav-group>.eyebrow{display:none}
  .nav-group+.nav-group{border-top:1px solid var(--hairline);margin-top:8px;padding-top:8px}
  .nav-item{flex-direction:column;gap:3px;padding:9px 4px;font-size:10.5px;text-align:center;line-height:1.15}
  .nav-item .ic{width:auto;font-size:17px}
  .nav-badge{position:absolute;top:4px;right:10px;margin:0}
  .nav-item{position:relative}
  .rail-foot .nav-item{font-size:10px}
  .split{grid-template-columns:1fr}
  .wall{grid-template-columns:repeat(auto-fill,minmax(208px,1fr))}
  .stats{grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
  .view{padding:16px 16px 48px}
  .search input{width:170px} .search input:focus{width:210px}
  /* Touch, not a mouse: everything tappable gets a real target. */
  .btn{padding:11px 15px} .btn.sm{padding:8px 11px}
  .nav-item{min-height:46px;justify-content:center}
  td{padding:14px 12px} th{padding:12px}
  .tabs button{padding:12px 14px}
  .icon-btn{width:40px;height:40px} .avatar{width:36px;height:36px}
  .seg button{padding:9px 13px}
}
/* ── iPad portrait: four stat cards read better as a square than as a
      row of three with one orphaned underneath ── */
@container (max-width:820px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .page-head .grow{min-width:180px}
}

/* ── narrow tablet / split view: the rail lies down ── */
@container (max-width:700px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;overflow-x:auto;align-items:center;
        border-right:0;border-bottom:1px solid var(--hairline)}
  .rail nav{display:flex;gap:4px;padding:6px} .nav-group{margin:0;display:flex;gap:4px}
  .nav-group>.eyebrow{display:none}
  .nav-item{flex-direction:row;min-width:max-content;font-size:12.5px}
  .brand,.org,.rail-foot{display:none}
  .wall,.stats{grid-template-columns:1fr}
  .page-head{gap:10px}

/** 24h in the data, 12h on the screen.

 *  strings, and "10:00 AM" sorts before "9:00 AM". Converting the data would
 *  have quietly broken that sort. */
const t12 = t => {
  if(!t || !/^\d{2}:\d{2}$/.test(t)) return t;
  let [h,m] = t.split(":").map(Number);
  const ap = h < 12 ? "AM" : "PM";
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,"0")} ${ap}`;
};
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const STATE_META = {

  help:{label:"Needs help", chip:"alarm", color:"var(--alarm)"},

function go(route, opts={}){

  render();

}
window.addEventListener("hashchange",()=>{

function toast(msg){

/* ═══════════════════════════════════════════════════════════════
   Small components
   ═══════════════════════════════════════════════════════════════ */
function sparkline(vals,w=104,h=22){
  const n=vals.length, step=w/(n-1);
  const pts=vals.map((v,i)=>[i*step, v?3:h-3]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L${w} ${h} L0 ${h} Z`;
  const miss=pts.filter((p,i)=>!vals[i]);
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true" style="display:block">
    <path d="${area}" fill="var(--ok-soft)"></path>
    <path d="${line}" fill="none" stroke="var(--ok)" stroke-width="1.6" stroke-linejoin="territory"></path>
    ${miss.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="var(--alarm)"></circle>`).join("")}
  </svg>`;
}
function chip(state){
  const m=STATE_META[state];
  return `<span class="chip ${m.chip}">${state==="help"?"⚠ ":""}${m.label}</span>`;
}
function filtered(){
  let list = CLIENTS.slice();
  if(S.loc!=="all") list=list.filter(c=>c.loc===S.loc);
  if(S.state!=="all") list=list.filter(c=>S.state==="attention"? (c.state==="missed"||c.state==="help") : c.state===S.state);
  if(S.q.trim()){
    const q=S.q.toLowerCase();
    list=list.filter(c=>c.name.toLowerCase().includes(q)||c.room.toLowerCase().includes(q)||locName(c.loc).toLowerCase().includes(q)||(c.code||'').toLowerCase().includes(q));
  }
  const rank={help:0,missed:1,due:2,ok:3};
  if(S.sort==="state") list.sort((a,b)=>rank[a.state]-rank[b.state]||a.name.localeCompare(b.name));
  if(S.sort==="name") list.sort((a,b)=>a.name.localeCompare(b.name));
  if(S.sort==="time") list.sort((a,b)=>(a.deadline).localeCompare(b.deadline));
  if(S.sort==="adherence") list.sort((a,b)=>pct(a)-pct(b));
  return list;
}
const pct = c => Math.round(c.adherence.reduce((a,b)=>a+b,0)/c.adherence.length*100);
const openAlerts = () => ALERTS.filter(a=>a.date==="Today" && a.status!=="resolved" && !S.acked[a.id]);

function viewAlerts(){
  const open=ALERTS.filter(a=>a.status!=="resolved"&&!S.acked[a.id]);
  const done=ALERTS.filter(a=>a.status==="resolved"||S.acked[a.id]);
  const row=a=>{const c=client(a.client);return `<tr data-alert="${a.id}">
    <td><strong>${esc(c.name)}</strong><div class="faint" style="font-size:11.5px">${esc(locName(c.loc))}</div></td>
    <td>${a.kind==="help"?`<span class="chip alarm">Help requested</span>`:`<span class="chip warn">Missed check-in</span>`}</td>
    <td>${a.date} <span class="n faint">${t12(a.at)}</span></td>
    <td>${S.acked[a.id]?`<span class="chip accent">You are on it</span>`:a.status==="resolved"?`<span class="chip ok">Resolved</span>`:a.status==="responding"?`<span class="chip accent">${esc(a.who)} responding</span>`:`<span class="chip alarm">Nobody yet</span>`}</td>
    <td class="muted" style="font-size:12.5px">${esc(a.note)}</td>
    <td style="text-align:right;white-space:nowrap">
      <button class="btn sm" data-contact="${c.id}">Contact</button>
      ${a.status!=="resolved"&&!S.acked[a.id]?`<button class="btn sm primary" data-ack="${a.id}">I've got this</button>`:""}
    </td></tr>`;};
  return `
  <div class="page-head">
    <div class="grow"><h1>Alerts</h1><p>Everything the system has raised. An alert closes when somebody says they have it, or when the client checks in.</p></div>
    <button class="btn" data-act="export">Export alert log</button>
  </div>
  <h3 style="margin-bottom:9px">Open now — ${open.length}</h3>
  ${open.length?`<div class="tablewrap" style="margin-bottom:22px"><table>
    <thead><tr><th>Client</th><th>Type</th><th>Raised</th><th>Status</th><th>Note</th><th></th></tr></thead>
    <tbody>${open.map(row).join("")}</tbody></table></div>`
    :`<div class="card card-pad" style="margin-bottom:22px;background:var(--ok-soft);border-color:var(--ok)">
       <strong style="color:var(--ok)">Nothing open.</strong> <span class="muted">Everyone who was due has checked in or been reached.</span></div>`}
  <h3 style="margin-bottom:9px">Resolved</h3>
  <div class="tablewrap"><table>
    <thead><tr><th>Client</th><th>Type</th><th>Raised</th><th>Status</th><th>Note</th><th></th></tr></thead>
    <tbody>${done.map(row).join("")}</tbody></table></div>`;
}

function viewAlert(id){
  const a=ALERTS.find(x=>x.id===id); if(!a) return `<div class="empty">Not found</div>`;
  const c=client(a.client);
  return `
  <div class="page-head">
    <div class="grow">
      <div class="eyebrow">Alert ${esc(a.id.toUpperCase())} · ${a.date} ${t12(a.at)}</div>
      <h1>${a.kind==="help"?"Help requested":"Missed check-in"} — ${esc(c.name)}</h1>
      <p>${esc(a.note)}</p>
    </div>
    <button class="btn" data-client="${c.id}">Open client</button>
    ${a.status!=="resolved"&&!S.acked[a.id]?`<button class="btn primary" data-ack="${a.id}">I've got this</button>`:""}
  </div>
  <div class="split">
    <div class="card card-pad">
      <h3>What happened</h3>
      <div class="timeline" style="margin-top:11px">
        <div class="tl ${a.kind==="help"?"alarm":"warn"}"><div class="t">${t12(a.at)}</div><div class="h">${a.kind==="help"?"Client pressed I NEED HELP":"Deadline passed with no check-in"}</div><div class="b">Due by ${t12(c.deadline)}.</div></div>
        <div class="tl accent"><div class="t">${t12(a.at)}</div><div class="h">Family notified</div><div class="b">${c.nokPhone?esc(c.nok)+" — push and SMS delivered.":"No family contact on file. Skipped to office."}</div></div>
        <div class="tl accent"><div class="t">+2 min</div><div class="h">On-call caregiver notified</div><div class="b">${esc((STAFF.find(s=>s.loc===c.loc)||STAFF[0]).name)} — push delivered.</div></div>
        ${a.who?`<div class="tl ok"><div class="t">+4 min</div><div class="h">${esc(a.who)} responded</div><div class="b">Marked "I've got this". Everyone else stood down.</div></div>`:
          `<div class="tl"><div class="t">Now</div><div class="h">Waiting for somebody to respond</div><div class="b">The office is notified after 5 minutes with no response.</div></div>`}
        ${a.status==="resolved"?`<div class="tl ok"><div class="t">Closed</div><div class="h">Resolved</div><div class="b">${esc(a.note)}</div></div>`:""}
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="card card-pad">
        <h3>Client</h3>
        <p style="margin-top:7px;font-weight:800;font-size:15px">${esc(c.name)}</p>
        <p class="muted" style="font-size:12.5px">${esc(c.room)} · ${esc(locName(c.loc))}</p>
        <div style="display:flex;gap:7px;margin-top:11px;flex-wrap:wrap">
          <button class="btn sm" data-contact="${c.id}">Contact</button>
          <button class="btn sm" data-client="${c.id}">Full record</button>
        </div>
      </div>
      <div class="card card-pad">
        <h3>Add a resolution note</h3>
        <div class="field" style="margin-top:9px"><textarea rows="3" placeholder="What did you find?"></textarea></div>
        <button class="btn primary" data-act="resolve">Mark resolved</button>
      </div>
    </div>
  </div>`;
}

        <button class="btn" style="margin-top:11px" data-noop>Choose a file</button></div>
      <p class="muted" style="font-size:12.5px;margin-top:12px">Nothing is saved until you have seen a preview and confirmed it.</p>`;
    foot=`<button class="btn" data-close>Cancel</button><button class="btn primary" data-do="14 rows read — review the preview">Continue</button>`;
  }
  if(kind==="confirm"){
    title=arg.title; body=`<p style="font-size:13px">${arg.body}</p>`;
    foot=`<button class="btn" data-close>Cancel</button><button class="btn danger" data-do="${esc(arg.done)}">${esc(arg.cta)}</button>`;
  }
  if(kind==="support"){
    title="Contact support";
    body=`<div class="field"><label>What is this about?</label><select><option>A client is not receiving alerts</option><option selected>A question about the portal</option><option>Billing</option><option>Urgent adult protective services</option></select></div>
      <div class="field"><label>Tell us what is happening</label><textarea rows="4" placeholder="The more specific the better."></textarea></div>
      <p class="muted" style="font-size:12.5px">Typical reply within 2 working hours. Safeguarding is answered immediately, day or night.</p>`;
    foot=`<button class="btn" data-close>Cancel</button><button class="btn primary" data-do="Message sent — we'll reply to mark@meadowcare.co">Send</button>`;
  }
  if(kind==="article"){
    title="What a client sees on their phone";
    body=`<p style="font-size:13px">One screen. One button that fills most of it. No password, no menus, nothing to read.</p>
      <div class="card card-pad" style="margin-top:13px;background:var(--canvas);text-align:center;padding:26px">
        <div style="width:150px;height:150px;border-radius:26px;background:var(--ink);color:var(--canvas);display:grid;place-items:center;margin:0 auto;font-weight:900;font-size:30px;letter-spacing:-.03em">I'M OK</div>
        <p class="muted" style="font-size:12.5px;margin-top:13px">Tap to tell your loved ones</p>
      </div>
      <p style="font-size:13px;margin-top:14px">When they tap it, everyone watching is told. If they do not tap by their deadline, everyone watching is told that instead — and the ladder you configured begins.</p>
      <p style="font-size:13px;margin-top:9px">They are never charged, never see a price, and never see this portal.</p>`;
    foot=`<button class="btn primary" data-close>Close</button>`;
  }
  return `<div class="scrim" data-scrim><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><h2 style="flex:1">${esc(title)}</h2>
      <button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot">${foot}</div></div></div>`;
}

/* ═══════════════════════════════════════════════════════════════
   Shell + render
   ═══════════════════════════════════════════════════════════════ */
const NAV=[
  ["Monitoring",[["today","Today","▦"],["alerts","Alerts","⚑"],["clients","Clients","☺"],["locations","Territories","⌂"]]],
  ["Organization",[["staff","Staff","♟"],["reports","Reports","▤"],["billing","Billing","$"]]],
  ["Account",[["settings","Settings","⚙"],["help","Help","?"]]],
];
function crumbs(){
  const r=S.route;
  const push=(l,t)=>`<button data-go="${t}">${l}</button><span class="sep">/</span>`;
  if(r.startsWith("client/")){const c=client(r.split("/")[1]);
    return push("Clients","clients")+`<span class="now">${esc(c?c.name:"Client")}</span>`;}
  if(r.startsWith("alert/")){const a=ALERTS.find(x=>x.id===r.split("/")[1]);
    return push("Alerts","alerts")+`<span class="now">${esc(a?client(a.client).name:"Alert")}</span>`;}
  if(r.startsWith("staff/")){const s=staff(r.split("/")[1]);
    return push("Staff","staff")+`<span class="now">${esc(s?s.name:"Staff")}</span>`;}
  if(r==="schedule") return push("Staff","staff")+`<span class="now">On-call schedule</span>`;
  const found=NAV.flatMap(g=>g[1]).find(n=>n[0]===r);
  return `<span class="now">${esc(found?found[1]:"Today")}</span>`;
}
function body(){
  const r=S.route;
  if(r.startsWith("client/")) return viewClient(r.split("/")[1]);
  if(r.startsWith("alert/")) return viewAlert(r.split("/")[1]);
  if(r.startsWith("staff/")) return viewStaffDetail(r.split("/")[1]);
  return ({today:viewToday,alerts:viewAlerts,clients:viewClients,locations:viewLocations,
           staff:viewStaff,schedule:viewRota,reports:viewReports,billing:viewBilling,
           settings:viewSettings,help:viewHelp,setup:viewSetup}[r]||viewToday)();
}
function render(){
  const root=$("#root");
  if(!S.authed){ root.innerHTML=viewSignIn(); wire(); return; }
  if(S.route==="setup"){ root.innerHTML=`<div class="view" style="padding-top:40px">${viewSetup()}</div>${modalHTML()}`; wire(); return; }
  const n=openAlerts().length;
  const framed = S.device!=="desktop";
  root.innerHTML=`
  ${framed?`<div class="stagebar">
    <div class="seg">
      <button data-device="desktop" aria-pressed="false">Desktop</button>
      <button data-device="ipad-l" aria-pressed="${S.device==="ipad-l"}">iPad landscape</button>
      <button data-device="ipad-p" aria-pressed="${S.device==="ipad-p"}">iPad portrait</button>
    </div>
    <span style="font-size:12px;opacity:.6">${S.device==="ipad-l"?"1024 × 768":"768 × 1024"} · fully interactive</span>
  </div>`:""}
  <div id="stage" data-device="${S.device}">
  <div class="app">
    <aside class="rail">
      <div class="brand"><span class="mark">P</span>
        <div><div class="brand-name">Pruuf for Care</div><div class="brand-sub">Provider portal</div></div></div>
      <div class="rel"><button class="org" data-menu="org">
        <span class="org-badge">MC</span><span class="org-name">Meadow Care LLC<br><span class="faint" style="font-weight:600;font-size:10.5px">14 clients · 3 territories</span></span><span class="faint">▾</span></button>
        ${S.menu==="org"?`<div class="menu" style="left:10px;right:10px;top:56px">
          <button data-do="Switched to Meadow Care LLC">Meadow Care LLC</button>
          <button data-do="Switched to Bramble Home Care">Bramble Home Care</button>
          <div class="divide"></div><button data-go="setup">+ Set up a new organization</button></div>`:""}
      </div>
      <nav>${NAV.map(([g,items])=>`<div class="nav-group"><div class="eyebrow">${g}</div>
        ${items.map(([k,l,ic])=>`<button class="nav-item" data-go="${k}" ${S.route===k||S.route.startsWith(k+"/")?'aria-current="page"':""}>
          <span class="ic">${ic}</span>${l}${k==="alerts"&&n?`<span class="nav-badge">${n}</span>`:""}</button>`).join("")}
      </div>`).join("")}</nav>
      <div class="rail-foot"><button class="nav-item" data-act="signout"><span class="ic">⏻</span>Sign out</button></div>
    </aside>
    <main>
      <header class="topbar">
        <div class="crumbs">${crumbs()}</div>
        <div class="search"><span class="ic">⌕</span>
          <input placeholder="Search clients, staff, alerts…" value="${esc(S.q)}" data-q aria-label="Search"></div>
        <div class="rel"><button class="icon-btn" data-menu="notif" aria-label="Notifications">⚑${n?`<span class="dot"></span>`:""}</button>
          ${S.menu==="notif"?`<div class="menu" style="min-width:290px">
            <div class="eyebrow" style="padding:7px 10px">Unread</div>
            ${openAlerts().map(a=>`<button data-alert="${a.id}"><span style="color:var(--alarm)">●</span><span><strong>${esc(client(a.client).name)}</strong><br><span class="faint" style="font-size:11.5px">${a.kind==="help"?"Help requested":"Missed check-in"} · ${a.at}</span></span></button>`).join("")||`<div class="muted" style="padding:9px 10px;font-size:12.5px">Nothing unread.</div>`}
            <div class="divide"></div><button data-go="alerts">Open alert board</button></div>`:""}
        </div>
        <button class="icon-btn" data-device-cycle aria-label="Preview on another device" title="Preview on iPad">▭</button>
        <button class="icon-btn" data-theme-toggle aria-label="Switch theme">◐</button>
        <div class="rel"><button class="avatar" data-menu="me">ME</button>
          ${S.menu==="me"?`<div class="menu">
            <div style="padding:8px 10px"><strong>Mark Ellis</strong><br><span class="faint" style="font-size:11.5px">Agency Administrator</span></div>
            <div class="divide"></div>
            <button data-staff="s6">My profile</button>
            <button data-go="settings">Organization settings</button>
            <button data-go="billing">Billing</button>
            <button data-go="help">Help</button>
            <div class="divide"></div>
            <button data-act="signout" style="color:var(--alarm)">Sign out</button></div>`:""}
        </div>
      </header>
      <div class="view">${body()}</div>
    </main>
  </div></div>${modalHTML()}`;
  wire();
}

/* ═══════════════════════════════════════════════════════════════
   Events — one delegated listener, so every control works
   ═══════════════════════════════════════════════════════════════ */
function wire(){
  const root=$("#root");
  root.onclick=e=>{
    const t=e.target.closest("[data-copy],[data-invite-family],[data-device],[data-device-cycle],[data-contact],[data-go],[data-client],[data-alert],[data-staff],[data-ack],[data-act],[data-menu],[data-close],[data-scrim],[data-do],[data-filter],[data-state],[data-clear],[data-sort],[data-tab],[data-setup],[data-signin],[data-newaccount],[data-loc-open],[data-theme-toggle],[data-noop],[data-oncall],[data-perm]");
    if(!t) { if(S.menu){S.menu=null;render();} return; }
    const d=t.dataset;

    if(d.scrim!==undefined && e.target===t){ closeModal(); return; }
    if(d.close!==undefined){ closeModal(); return; }
    if(d.deviceCycle!==undefined){
      S.device = S.device==="desktop" ? "ipad-l" : S.device==="ipad-l" ? "ipad-p" : "desktop";
      render(); return;
    }
    if(d.device!==undefined){ S.device=d.device; render(); return; }
    if(d.themeToggle!==undefined){
      const cur=document.documentElement.getAttribute("data-theme")
        || (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
      document.documentElement.setAttribute("data-theme",cur==="dark"?"light":"dark"); return;
    }
    if(d.signin!==undefined){ S.authed=true; go("today"); toast("Signed in as Mark Ellis"); return; }
    if(d.newaccount!==undefined){ S.authed=true; S.setupStep=0; go("setup"); return; }
    if(d.menu!==undefined){ S.menu = S.menu===d.menu?null:d.menu; render(); return; }
    if(d.go!==undefined){ go(d.go); return; }
    if(d.copy!==undefined){
      navigator.clipboard?.writeText(d.copy);
      toast("Code "+d.copy+" copied"); return;
    }
    if(d.inviteFamily!==undefined){ openModal("sendcode", d.inviteFamily); return; }
    if(d.contact!==undefined){ openModal("contact",d.contact); return; }
    if(d.client!==undefined){ go("client/"+d.client); return; }
    if(d.alert!==undefined){ go("alert/"+d.alert); return; }
    if(d.staff!==undefined){ go("staff/"+d.staff); return; }
    if(d.locOpen!==undefined){ S.loc=d.locOpen; go("today"); toast("Filtered to "+locName(d.locOpen)); return; }
    if(d.filter!==undefined){ S.state=d.filter; go("today"); return; }
    if(d.state!==undefined){ S.state=d.state; render(); return; }
    if(d.clear!==undefined){ S.state="all"; S.loc="all"; S.q=""; render(); return; }
    if(d.tab!==undefined){ S.tab=d.tab; render(); return; }
    if(d.ack!==undefined){
      S.acked[d.ack]=true;
      const a=ALERTS.find(x=>x.id===d.ack);
      if(a){a.status="responding"; a.who="Mark Ellis"; const c=client(a.client); if(c) c.responder="Mark Ellis";}
      render(); toast("Everyone else has been stood down"); return;
    }
    if(d.setup!==undefined){
      if(d.setup==="back"&&S.setupStep>0) S.setupStep--;
      else if(d.setup==="skip"){ S.authed=true; go("today"); toast("You can finish setup any time from Settings"); return; }
      else if(d.setup==="next"){
        if(S.setupStep<SETUP.length-1) S.setupStep++;
        else { S.authed=true; go("today"); toast("Setup complete — welcome to Pruuf"); return; }
      }
      render(); return;
    }
    if(d.do!==undefined){ closeModal(); toast(d.do); return; }
    if(d.noop!==undefined||d.oncall!==undefined||d.perm!==undefined){
      if(d.oncall!==undefined){ const s=staff(d.oncall); if(s){s.oncall=!s.oncall; toast(s.name+(s.oncall?" added to tonight's schedule":" taken off call"));} }
      return;
    }
    if(d.act!==undefined){
      const A=d.act;
      if(A==="signout"){ S.authed=false; S.menu=null; render(); return; }
      if(A==="export"){ openModal("export"); return; }
      if(A==="invite"){ openModal("invite"); return; }
      if(A==="addclient"){ openModal("addclient"); return; }
      if(A==="import"){ openModal("import"); return; }
      if(A==="contact-support"){ openModal("support"); return; }
      if(A==="article"){ openModal("article"); return; }
      if(A==="remove-client"){ openModal("confirm",{title:"Remove this client?",body:"Monitoring stops immediately and their family stops being told. Their history is kept for six years and stays in your exports.",cta:"Remove client",done:"Client removed — monitoring stopped"}); return; }
      if(A==="remove-staff"){ openModal("confirm",{title:"Remove access?",body:"They will be signed out everywhere and will stop receiving alerts. Their name stays on past records.",cta:"Remove access",done:"Access removed"}); return; }
      if(A==="cancel-plan"){ openModal("confirm",{title:"Cancel your plan?",body:"Monitoring stops for all 14 clients at the end of the current period. Families stop being told when somebody misses a check-in.",cta:"Cancel plan",done:"Plan will end on August 31"}); return; }
      if(A==="pause"){ openModal("confirm",{title:"Pause monitoring?",body:"No alerts will be raised for this client until you turn it back on. Use this for a hospital stay or a holiday.",cta:"Pause",done:"Monitoring paused"}); return; }
      if(A==="signout-device"){ openModal("confirm",{title:"Sign out this device?",body:"It will stop being able to check in. If it is their only device, nobody will be able to check in at all.",cta:"Sign out",done:"Device signed out"}); return; }
      const say={save:"Saved",escalate:"Escalated to the office",resolve:"Alert marked resolved",
        "add-note":"Note added","add-contact":"Contact added","add-nok":"Emergency contact added",
        pair:"Pairing code sent","reset-pw":"Password reset sent","edit-client":"Check-in time updated",
        "move-territory":"Client moved","add-loc":"Territory created","change-plan":"Plan updated",
        "update-card":"Payment method updated","edit-billing":"Billing details saved",
        "download-invoice":"Invoice downloaded","run-report":"Report running — we'll email it",
        schedule:"Schedule updated",reassign:"Schedule updated","call-support":"Calling 1-800-555-0142…",
        status:"All systems normal for 90 days"}[A];
      if(say) toast(say);
      return;
    }
  };
  const q=root.querySelector("[data-q]");
  if(q) q.oninput=e=>{ S.q=e.target.value;
    if(!["today","clients"].includes(S.route)) { S.route="clients"; location.hash="clients"; }
    render(); const f=$("[data-q]"); if(f){f.focus(); f.setSelectionRange(f.value.length,f.value.length);} };
  root.querySelectorAll("[data-loc]").forEach(el=>el.onchange=e=>{S.loc=e.target.value;render();});
  root.querySelectorAll("[data-sort]").forEach(el=>{ if(el.tagName==="SELECT") el.onchange=e=>{S.sort=e.target.value;render();}; });
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(S.modal) closeModal(); else if(S.menu){S.menu=null;render();} } });

// Deep links, so a state can be linked to or captured without clicking there.
//   ?auth=1        skip the sign-in screen
//   ?theme=light   pin the theme (headless browsers default to dark)
//   ?device=ipad-l show it inside a device frame
//   #clients       any route
const qs = new URLSearchParams(location.search);
if (qs.get("theme")) document.documentElement.setAttribute("data-theme", qs.get("theme"));
if (qs.get("auth")) S.authed = true;
if (qs.get("device")) S.device = qs.get("device");
const initial=location.hash.slice(1);
if(initial){ S.route=initial; S.authed = true; }
render();
</script>
